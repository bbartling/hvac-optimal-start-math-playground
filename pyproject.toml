[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hvac-optimal"
version = "1.0.0"
description = "Data-driven HVAC optimal start and optimal stop (PNNL models + robust RLS), benchmarked on the NeurIPS 2026 smart-buildings simulator"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
bench = ["numpy", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
